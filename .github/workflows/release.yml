name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "Resources/Info.plist"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build app
        run: bash scripts/build-app.sh

      - name: Import Developer ID certificate when configured
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "No Developer ID certificate configured; using ad-hoc signing."
            exit 0
          fi
          echo "$CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Sign app
        env:
          IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
        run: |
          if [[ -n "$IDENTITY" ]]; then
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "dist/MCP Controller.app"
          else
            codesign --force --deep --sign - --identifier com.versyi.mcp-controller "dist/MCP Controller.app"
          fi
          codesign --verify --deep --strict --verbose=2 "dist/MCP Controller.app"

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "dist/MCP Controller.app" "dist/MCP-Controller-macOS.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" "dist/MCP-Controller-macOS.zip" --target "$GITHUB_SHA" --generate-notes --title "MCP Controller $TAG"
