name: Apply and release v0.6.5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.6.5.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Apply copy-button fix and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Sources/MCPController/Views/ExposureSettingsView.swift")
          text = path.read_text()
          replacements = [
              (
                  '''                            .pickerStyle(.segmented)
''',
                  '''                            .pickerStyle(.segmented)
                            .disabled(model.tailscaleFunnelRunning)
'''
              ),
              (
                  '''                            .frame(width: 120)
''',
                  '''                            .frame(width: 120)
                            .disabled(model.tailscaleFunnelRunning)
'''
              ),
              (
                  '''                                .font(.system(.subheadline, design: .monospaced))
''',
                  '''                                .font(.system(.subheadline, design: .monospaced))
                                .disabled(model.tailscaleFunnelRunning)
'''
              ),
              (
                  '''                    }
                    .disabled(model.tailscaleFunnelRunning)

                    Text(model.tailscaleFunnelRunning
''',
                  '''                    }

                    Text(model.tailscaleFunnelRunning
'''
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected source snippet was not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "## Unreleased\n"
          entry = """## Unreleased

## v0.6.5

### Fixed
- Kept the Remote URL copy button enabled while the shared Tailscale Funnel is running.
- Limited the live-route lock to editable audience, port, and route-path controls instead of disabling the entire Remote access grid.
"""
          if marker not in text:
              raise SystemExit("CHANGELOG Unreleased marker missing")
          changelog.write_text(text.replace(marker, entry, 1))
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.6.5" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 12" Resources/Info.plist

      - name: Test
        run: swift test

      - name: Build
        run: bash scripts/build-app.sh

      - name: Commit and push source release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/MCPController/Views/ExposureSettingsView.swift Resources/Info.plist CHANGELOG.md
          git commit -m "fix: keep remote URL copy available"
          git push origin HEAD:main

      - name: Import Developer ID certificate when configured
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "No Developer ID certificate configured; using ad-hoc signing."
            exit 0
          fi
          echo "$CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Sign and package
        env:
          IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
        run: |
          if [[ -n "$IDENTITY" ]]; then
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "dist/MCP Controller.app"
          else
            codesign --force --deep --sign - --identifier com.versyi.mcp-controller "dist/MCP Controller.app"
          fi
          codesign --verify --deep --strict --verbose=2 "dist/MCP Controller.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/MCP Controller.app" "dist/MCP-Controller-macOS.zip"

      - name: Publish v0.6.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          gh release create v0.6.5 "dist/MCP-Controller-macOS.zip" --target "$SHA" --generate-notes --title "MCP Controller v0.6.5"
