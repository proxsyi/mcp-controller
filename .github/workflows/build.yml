name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Resolve version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Test
        run: swift test
      - name: Build app bundle
        run: bash scripts/build-app.sh
      - name: Package artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/MCP Controller.app" "dist/MCP-Controller-macOS.zip"
          cd dist
          shasum -a 256 "MCP-Controller-macOS.zip" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MCP-Controller-macOS-v${{ steps.version.outputs.version }}-build${{ steps.version.outputs.build }}
          path: |
            dist/MCP-Controller-macOS.zip
            dist/SHA256SUMS.txt
